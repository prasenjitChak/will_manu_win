<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Will Manu Win?</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #131a22;
    --card-border: #223040;
    --text: #e7edf3;
    --muted: #8ea0b3;
    --accent: #5eead4;
    --win: #34d399;
    --loss: #f87171;
    --pending: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  header {
    max-width: 900px;
    margin: 0 auto 24px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 4px;
  }
  header p {
    color: var(--muted);
    margin: 0;
  }
  #stats {
    max-width: 900px;
    margin: 0 auto 24px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    min-width: 100px;
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  main { max-width: 900px; margin: 0 auto; }
  .matchday-heading {
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 28px 0 10px;
  }
  .fixture {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .side { display: flex; flex-direction: column; gap: 2px; }
  .side.away { text-align: right; align-items: flex-end; }
  .team { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .side.away .team { flex-direction: row-reverse; }
  .form { font-size: 11px; color: var(--muted); }
  .mid { text-align: center; min-width: 120px; }
  .score {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .predicted {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .badge {
    display: inline-block;
    margin-top: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.correct { background: rgba(52, 211, 153, 0.15); color: var(--win); }
  .badge.wrong { background: rgba(248, 113, 113, 0.15); color: var(--loss); }
  .badge.pending { background: rgba(100, 116, 139, 0.15); color: var(--pending); }
  .reasoning {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px dashed var(--card-border);
    margin-top: 8px;
    padding-top: 8px;
  }
  #empty, #loading {
    text-align: center;
    color: var(--muted);
    margin-top: 60px;
  }
  footer {
    max-width: 900px;
    margin: 32px auto 0;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>⚽ Will Manu Win?</h1>
  <p>A little agent that predicts every EPL matchweek and keeps score on itself.</p>
</header>

<div id="stats"></div>
<div id="loading">loading the scoreboard&hellip;</div>
<div id="empty" style="display:none">No predictions recorded yet. Run the loop, then push.</div>
<main id="fixtures"></main>

<footer>
  data refreshes straight from <a href="https://github.com/prasenjitChak/will_manu_win/blob/main/ts/data/season.json" target="_blank" rel="noopener">season.json</a> on every page load
</footer>

<script>
  const DATA_URL =
    "https://raw.githubusercontent.com/prasenjitChak/will_manu_win/main/ts/data/season.json?_=" + Date.now();

  const RESULT_LABEL = { home_win: "HOME", draw: "DRAW", away_win: "AWAY" };

  function formEmoji(form) {
    if (!form) return "❓";
    const letters = form.split("");
    if (letters.every((c) => c === "W")) return "🔥";
    if (letters.every((c) => c === "L")) return "🗑️";
    const score = letters.reduce((s, c) => s + (c === "W" ? 1 : c === "L" ? -1 : 0), 0);
    const last = letters[letters.length - 1];
    if (score >= 2) return "😎";
    if (score <= -2) return "😭";
    if (last === "L") return "📉";
    if (last === "W") return "📈";
    return "😬";
  }

  function fixtureCard(f) {
    const scored = f.actual_result != null;
    const predictedLabel = f.predicted_score
      ? `predicted ${f.predicted_score} (${RESULT_LABEL[f.predicted_result]})`
      : `predicted ${RESULT_LABEL[f.predicted_result]}`;

    const scoreLine = scored
      ? `<div class="score">${f.actual_home_score} – ${f.actual_away_score}</div>`
      : `<div class="score" style="color:var(--pending)">vs</div>`;

    const badge = !scored
      ? `<span class="badge pending">PENDING</span>`
      : f.correct
        ? `<span class="badge correct">✅ CALLED IT</span>`
        : `<span class="badge wrong">❌ MISSED</span>`;

    return `
      <div class="fixture">
        <div class="side home">
          <div class="team">${formEmoji(f.home_form)} ${f.home}</div>
          <div class="form">${f.home_form ?? ""}</div>
        </div>
        <div class="mid">
          ${scoreLine}
          <div class="predicted">${predictedLabel}</div>
          ${badge}
        </div>
        <div class="side away">
          <div class="team">${f.away} ${formEmoji(f.away_form)}</div>
          <div class="form">${f.away_form ?? ""}</div>
        </div>
        ${f.reasoning ? `<div class="reasoning">${f.reasoning}</div>` : ""}
      </div>`;
  }

  function render(fixtures) {
    document.getElementById("loading").style.display = "none";
    if (fixtures.length === 0) {
      document.getElementById("empty").style.display = "block";
      return;
    }

    const scored = fixtures.filter((f) => f.actual_result != null);
    const correct = scored.filter((f) => f.correct).length;
    const accuracy = scored.length ? Math.round((correct / scored.length) * 100) : 0;
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="n">${fixtures.length}</div><div class="l">predicted</div></div>
      <div class="stat"><div class="n">${scored.length}</div><div class="l">played</div></div>
      <div class="stat"><div class="n">${correct}/${scored.length}</div><div class="l">correct</div></div>
      <div class="stat"><div class="n">${accuracy}%</div><div class="l">accuracy</div></div>
    `;

    const byMatchday = {};
    for (const f of fixtures) (byMatchday[f.matchday] ??= []).push(f);
    const matchdays = Object.keys(byMatchday).map(Number).sort((a, b) => b - a);

    const html = matchdays
      .map((md) => {
        const list = byMatchday[md].sort((a, b) => (a.date < b.date ? -1 : 1));
        return `<div class="matchday-heading">Matchday ${md}</div>` + list.map(fixtureCard).join("");
      })
      .join("");
    document.getElementById("fixtures").innerHTML = html;
  }

  fetch(DATA_URL)
    .then((r) => r.json())
    .then((data) => render(Object.values(data.fixtures ?? {})))
    .catch((e) => {
      document.getElementById("loading").textContent = "couldn't load season.json: " + e.message;
    });
</script>
</body>
</html>
